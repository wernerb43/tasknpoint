# Motion set configuration.
# Motions are applied in the order listed here — this order must match
# the order of files you pass to training/evaluation.
#
# Usage:
#   Train:    uv run train <task> --registry-name $(uv run motion-set motion_sets/all_motions.toml)
#   Evaluate: ... --registry-name $(uv run motion-set motion_sets/all_motions.toml --eval)

[robot]
xml = "robots/g1_tennis_27dof.xml"

[registry]
train_prefix = "bwerner-california-institute-of-technology-caltech/csv_to_npz"
eval_prefix  = "bwerner-california-institute-of-technology-caltech-org/wandb-registry-motions"

[[motions]]
name    = "right_kick"
enabled = true

[[motions]]
name    = "left_kick"
enabled = true

[[motions]]
name    = "right_far_kick"
enabled = true

[[motions]]
name    = "left_far_kick"
enabled = true

[[motions]]
name    = "forehand"
enabled = true

[[motions]]
name    = "backhand"
enabled = true

[[motions]]
name    = "two_step_forehand"
enabled = true

[[motions]]
name    = "two_step_backhand"
enabled = true

[[motions]]
name    = "stepback_forehand"
enabled = true

[[motions]]
name    = "stepback_backhand"
enabled = true
