# Kicks-only motion subset.

[robot]
xml = "robots/training/g1_27dof_training.xml"

[registry]
train_prefix = "bwerner-california-institute-of-technology-caltech/csv_to_npz"

[[motions]]
name    = "right_kick"
enabled = true

[[motions]]
name    = "left_kick"
enabled = true

[[motions]]
name    = "right_far_kick"
enabled = true

[[motions]]
name    = "left_far_kick"
enabled = true
