# Tennis stroke variants only (forehand/backhand + footwork variants).

[robot]
xml = "robots/g1_tennis_27dof.xml"

[registry]
train_prefix = "bwerner-california-institute-of-technology-caltech/csv_to_npz"
eval_prefix  = "bwerner-california-institute-of-technology-caltech-org/wandb-registry-motions"

[[motions]]
name    = "forehand"
enabled = true

[[motions]]
name    = "backhand"
enabled = true

[[motions]]
name    = "two_step_forehand"
enabled = true

[[motions]]
name    = "two_step_backhand"
enabled = true

[[motions]]
name    = "stepback_forehand"
enabled = true

[[motions]]
name    = "stepback_backhand"
enabled = true

[[motions]]
name    = "one_step_forehand"
enabled = true

[[motions]]
name    = "forehand_sidestep"
enabled = true

[[motions]]
name    = "forehand_two_sidestep"
enabled = true

[[motions]]
name    = "backhand_onehand"
enabled = true

[[motions]]
name    = "backhand_onehand_step"
enabled = true

[[motions]]
name    = "pickup_bench_to_floor"
enabled = true

