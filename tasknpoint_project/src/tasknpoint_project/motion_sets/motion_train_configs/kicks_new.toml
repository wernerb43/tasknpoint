# Kicks-only motion subset.

[robot]
xml = "robots/g1_soccer_27dof.xml"

[registry]
train_prefix = "bwerner-california-institute-of-technology-caltech/csv_to_npz"
eval_prefix  = "bwerner-california-institute-of-technology-caltech-org/wandb-registry-motions"

[[motions]]
name    = "one_step_right_kick"
enabled = true

[[motions]]
name    = "one_step_left_kick"
enabled = true

[[motions]]
name    = "two_step_right_kick"
enabled = true

[[motions]]
name    = "two_step_left_kick"
enabled = true

[[motions]]
name    = "two_baby_step_right_kick"
enabled = true