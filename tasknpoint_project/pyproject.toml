[project]
name = "tasknpoint-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Blake", email = "bwerner@caltech.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "mjlab>=1.3.0",
]

[project.scripts]
tasknpoint-project = "tasknpoint_project:main"
train        = "tasknpoint_project.scripts.train:main"
play         = "tasknpoint_project.scripts.play:main"
demo         = "tasknpoint_project.scripts.demo:main"
list-envs    = "tasknpoint_project.scripts.list_envs:main"
viz-nan      = "tasknpoint_project.scripts.nan_viz:main"
export-scene = "tasknpoint_project.scripts.export_scene:main"

[project.entry-points."mjlab.tasks"]
tasknpoint = "tasknpoint_project.tracking.config.g1"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
